# ============================================================
# application.properties — Voz do Povo
# ============================================================

# ------------------------------
# Servidor
# ------------------------------
server.port=8080

# ------------------------------
# Banco de dados — H2 in-memory
# ------------------------------
spring.datasource.url=jdbc:h2:mem:vozdopovodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------
# JPA / Hibernate
# ------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed via DataLoader (Java) — data.sql não é mais necessário
spring.sql.init.mode=never

# ------------------------------
# JWT
# ------------------------------
# Chave secreta: mínimo 32 caracteres para HS256
jwt.secret=vozdopovo-chave-secreta-minimo-32-chars!
jwt.expiration-ms=86400000

# ------------------------------
# IA — serviço Gemini externo
# ------------------------------
ia.api.url=http://localhost:8000/processar

# ------------------------------
# Gerador de TXT dos planos
# ------------------------------
plano.txt.diretorio=arquivos/planos