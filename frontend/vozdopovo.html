                color: "var(--muted)",
                fontSize: "0.875rem",
                marginBottom: "1.5rem",
              }}
            >
              Envie dúvidas ou demandas diretamente para {candidato.nome}.
            </p>

            {success && (
              <div className="alert alert-success">
                ✓ Interação enviada! Você pode acompanhar as respostas em
                "Minhas Interações".
              </div>
            )}

            <div className="form-group">
              <label className="form-label">Tipo</label>
              <select
                className="form-select"
                value={form.tipo}
                onChange={set("tipo")}
              >
                <option value="DUVIDA">❓ Dúvida</option>
                <option value="DEMANDA">📢 Demanda</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">
                Título{" "}
                <span style={{ color: "var(--muted)", fontSize: "0.8rem" }}>
                  (opcional)
                </span>
              </label>
              <input
                className="form-input"
                value={form.titulo}
                onChange={set("titulo")}
                placeholder="Resumo da sua mensagem"
                maxLength={150}
              />
            </div>
            <div className="form-group">
              <label className="form-label">Mensagem</label>
              <textarea
                className="form-textarea"
                value={form.conteudo}
                onChange={set("conteudo")}
                placeholder="Descreva sua dúvida ou demanda em detalhes..."
                rows={5}
              />
            </div>
            <div className="form-group">
              <label className="form-label">
                URL de comprovação{" "}
                <span style={{ color: "var(--muted)", fontSize: "0.8rem" }}>
                  (opcional)
                </span>
              </label>
              <input
                className="form-input"
                value={form.urlComprovacao}
                onChange={set("urlComprovacao")}
                placeholder="https://..."
              />
            </div>
            <button
              className="btn btn-green btn-lg"
              onClick={submit}
              disabled={loading || !form.conteudo.trim()}
            >
              {loading ? "Enviando..." : "📨 Enviar interação"}
            </button>
          </div>
        );
      }

      // ─── INTERAÇÕES PAGE (ELEITOR) ───
      function InteracoesPage({ ctx }) {
        const [interacoes, setInteracoes] = useState([]);
        const [loading, setLoading] = useState(true);
        const [filter, setFilter] = useState("");

        useEffect(() => {
          if (!ctx.session) {
            ctx.navigate("auth");
            return;
          }
          apiFetch(
            `/interacoes/eleitor/${ctx.session.id}`,
            {},
            ctx.session.token,
          )
            .then((d) => {
              setInteracoes(d);
              setLoading(false);
            })
            .catch(() => setLoading(false));
        }, []);

        const filtered = filter
          ? interacoes.filter((i) => i.status === filter || i.tipo === filter)
          : interacoes;

        return (
          <div className="page">
            <div className="breadcrumb">
              <a onClick={() => ctx.navigate("home")}>Início</a>
              <span className="breadcrumb-sep">›</span>
              <span>Minhas Interações</span>
            </div>
            <div className="page-title">Minhas Interações</div>
            <div className="page-subtitle">
              Acompanhe suas dúvidas e demandas enviadas aos candidatos
            </div>

            <div
              style={{
                display: "flex",
                gap: "0.5rem",
                marginBottom: "1.5rem",
                flexWrap: "wrap",
              }}
            >
              {[
                "",
                "DUVIDA",
                "DEMANDA",
                "RECEBIDA",
                "RESPONDIDA",
                "FINALIZADA",
              ].map((f) => (
                <button
                  key={f}
                  className={`btn btn-sm ${filter === f ? "btn-primary" : "btn-outline"}`}
                  onClick={() => setFilter(f)}
                >
                  {f || "Todas"}
                </button>
              ))}
            </div>

            {loading ? (
              <div className="empty-state">
                <div className="empty-icon">⏳</div>
                <p>Carregando...</p>
              </div>
            ) : filtered.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                <div className="empty-title">Nenhuma interação encontrada</div>
                <div className="empty-sub">
                  Explore os candidatos e envie suas dúvidas!
                </div>
                <button
                  className="btn btn-primary mt-2"
                  onClick={() => ctx.navigate("candidates")}
                >
                  Ver candidatos
                </button>
              </div>
            ) : (
              filtered.map((i) => (
                <div key={i.id} className="interacao-card">
                  <div className="interacao-header">
                    <div className="interacao-title">
                      {i.titulo || "(sem título)"}
                    </div>
                    <div style={{ display: "flex", gap: "0.4rem" }}>
                      {statusBadge(i.tipo)}
                      {statusBadge(i.status)}
                    </div>
                  </div>
                  <div className="interacao-meta">
                    <span>Candidato #{i.candidatoId}</span>
                    <span>Enviado: {fmtDate(i.dataInicio)}</span>
                    {i.dataResposta && (
                      <span>Respondido: {fmtDate(i.dataResposta)}</span>
                    )}
                  </div>
                  <div className="interacao-conteudo">{i.conteudo}</div>
                  {i.resposta && (
                    <div className="interacao-resposta">
                      <div className="interacao-resposta-label">
                        ✓ Resposta do candidato
                      </div>
                      {i.resposta}
                    </div>
                  )}
                </div>
              ))
            )}
          </div>
        );
      }

      // ─── DASHBOARD PAGE (CANDIDATO) ───
      function DashboardPage({ ctx }) {
        const [dashTab, setDashTab] = useState("overview");
        const [plan, setPlan] = useState(null);
        const [interacoes, setInteracoes] = useState([]);
        const [stats, setStats] = useState({
          temas: 0,
          propostas: 0,
          interacoes: 0,
          pendentes: 0,
        });
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          if (!ctx.session || ctx.session.role !== "CANDIDATO") {
            ctx.navigate("home");
            return;
          }
          loadData();
        }, []);

        const loadData = async () => {
          setLoading(true);
          try {
            const p = await apiFetch(
              `/planos-de-governo/candidato/${ctx.session.id}`,
              {},
              ctx.session.token,
            ).catch(() => null);
            setPlan(p);

            const ints = await apiFetch(
              `/interacoes/candidato/${ctx.session.id}`,
              {},
              ctx.session.token,
            ).catch(() => []);
            setInteracoes(ints);

            if (p?.id) {
              const temas = await apiFetch(
                `/temas/plano/${p.id}/todos`,
                {},
                ctx.session.token,
              ).catch(() => []);
              const props = await Promise.all(
                temas.map((t) =>
                  apiFetch(
                    `/propostas/tema/${t.id}/todas`,
                    {},
                    ctx.session.token,
                  ).catch(() => []),
                ),
              );
              setStats({
                temas: temas.length,
                propostas: props.flat().length,
                interacoes: ints.length,
                pendentes: ints.filter(
                  (i) => i.status === "RECEBIDA" || i.status === "EM_ANALISE",
                ).length,
              });
            } else {
              setStats((s) => ({
                ...s,
                interacoes: ints.length,
                pendentes: ints.filter((i) => i.status === "RECEBIDA").length,
              }));
            }
          } catch {}
          setLoading(false);
        };

        const navItems = [
          { id: "overview", icon: "📊", label: "Visão Geral" },
          { id: "plan", icon: "📄", label: "Plano de Governo" },
          { id: "interactions", icon: "💬", label: "Interações" },
          { id: "profile", icon: "👤", label: "Meu Perfil" },
        ];

        return (
          <div className="page">
            <div style={{ marginBottom: "1.5rem" }}>
              <div className="page-title">Painel do Candidato</div>
              <div className="page-subtitle">
                Gerencie seu plano de governo e interações com eleitores
              </div>
            </div>

            <div className="dashboard-grid">
              <div className="dashboard-nav">
                <div
                  style={{
                    padding: "1.25rem 1.25rem 0.75rem",
                    borderBottom: "1px solid var(--border)",
                  }}
                >
                  <div
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: "0.75rem",
                    }}
                  >
                    <div
                      className="card-avatar"
                      style={{ width: 44, height: 44, fontSize: "1rem" }}
                    >
                      {initials(ctx.session.nome)}
                    </div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: "0.9rem" }}>
                        {ctx.session.nome}
                      </div>
                      <div
                        style={{ fontSize: "0.75rem", color: "var(--muted)" }}
                      >
                        Candidato
                      </div>
                    </div>
                  </div>
                </div>
                {navItems.map((item) => (
                  <div
                    key={item.id}
                    className={`dash-nav-item ${dashTab === item.id ? "active" : ""}`}
                    onClick={() => setDashTab(item.id)}
                  >
                    <span className="nav-icon">{item.icon}</span>
                    {item.label}
                    {item.id === "interactions" && stats.pendentes > 0 && (
                      <span
                        className="badge badge-red"
                        style={{ marginLeft: "auto", fontSize: "0.65rem" }}
                      >
                        {stats.pendentes}
                      </span>
                    )}
                  </div>
                ))}
              </div>

              <div>
                {loading ? (
                  <div className="empty-state">
                    <div className="empty-icon">⏳</div>
                    <p>Carregando...</p>
                  </div>
                ) : (
                  <>
                    {dashTab === "overview" && (
                      <DashOverview
                        stats={stats}
                        plan={plan}
                        interacoes={interacoes}
                        setDashTab={setDashTab}
                        ctx={ctx}
                      />
                    )}
                    {dashTab === "plan" && (
                      <DashPlan plan={plan} ctx={ctx} reload={loadData} />
                    )}
                    {dashTab === "interactions" && (
                      <DashInteractions
                        interacoes={interacoes}
                        ctx={ctx}
                        reload={loadData}
                      />
                    )}
                    {dashTab === "profile" && <DashProfile ctx={ctx} />}
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function DashOverview({ stats, plan, interacoes, setDashTab, ctx }) {
        return (
          <div>
            <div className="stats-row">
              {[
                [
                  "📄",
                  plan
                    ? plan.status === "PUBLICADO"
                      ? "Publicado"
                      : "Rascunho"
                    : "Sem plano",
                  "Plano",
                ],
                ["🏷️", stats.temas, "Temas"],
                ["📋", stats.propostas, "Propostas"],
                ["💬", stats.interacoes, "Interações"],
                ["⏳", stats.pendentes, "Pendentes"],
              ].map(([icon, val, label]) => (
                <div key={label} className="stat-box">
                  <div style={{ fontSize: "1.5rem", marginBottom: "0.4rem" }}>
                    {icon}
                  </div>
                  <div className="stat-num" style={{ fontSize: "1.5rem" }}>
                    {val}
                  </div>
                  <div className="stat-label">{label}</div>
                </div>
              ))}
            </div>

            {!plan && (
              <div className="alert alert-info">
                📄 Você ainda não criou seu plano de governo.{" "}
                <button
                  className="btn btn-primary btn-sm"
                  style={{ marginLeft: "0.5rem" }}
                  onClick={() => setDashTab("plan")}
                >
                  Criar agora
                </button>
              </div>
            )}

            {interacoes.filter((i) => i.status === "RECEBIDA").length > 0 && (
              <div className="alert alert-info">
                💬 Você tem{" "}
                {interacoes.filter((i) => i.status === "RECEBIDA").length}{" "}
                interação(ões) aguardando resposta.
                <button
                  className="btn btn-primary btn-sm"
                  style={{ marginLeft: "0.5rem" }}
                  onClick={() => setDashTab("interactions")}
                >
                  Responder
                </button>
              </div>
            )}

            <div
              style={{
                background: "#fff",
                border: "1px solid var(--border)",
                borderRadius: 12,
                padding: "1.5rem",
              }}
            >
              <div style={{ fontWeight: 700, marginBottom: "1rem" }}>
                Últimas interações
              </div>
              {interacoes.length === 0 ? (
                <p style={{ color: "var(--muted)", fontSize: "0.875rem" }}>
                  Nenhuma interação recebida ainda.
                </p>
              ) : (
                interacoes.slice(0, 3).map((i) => (
                  <div
                    key={i.id}
                    style={{
                      padding: "0.85rem 0",
                      borderBottom: "1px solid var(--border)",
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      gap: "1rem",
                    }}
                  >
                    <div>
                      <div style={{ fontWeight: 600, fontSize: "0.9rem" }}>
                        {i.titulo || i.conteudo.substring(0, 60) + "..."}
                      </div>
                      <div
                        style={{ fontSize: "0.78rem", color: "var(--muted)" }}
                      >
                        {fmtDate(i.dataInicio)}
                      </div>
                    </div>
                    <div
                      style={{ display: "flex", gap: "0.4rem", flexShrink: 0 }}
                    >
                      {statusBadge(i.tipo)}
                      {statusBadge(i.status)}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        );
      }

      function DashPlan({ plan, ctx, reload }) {
        const [form, setForm] = useState({
          titulo: plan?.titulo || "",
          apresentacao: plan?.apresentacao || "",
        });
        const [temas, setTemas] = useState([]);
        const [loading, setLoading] = useState(false);
        const [showTemaForm, setShowTemaForm] = useState(false);
        const [temaForm, setTemaForm] = useState({ titulo: "", descricao: "" });
        const [showPropostaModal, setShowPropostaModal] = useState(null);
        const [propostaForm, setPropostaForm] = useState({
          titulo: "",
          resumo: "",
          detalhamento: "",
        });
        const [temaPropostas, setTemaPropostas] = useState({});

        const set = (k) => (e) =>
          setForm((f) => ({ ...f, [k]: e.target.value }));

        useEffect(() => {
          if (plan?.id) {
            apiFetch(`/temas/plano/${plan.id}/todos`, {}, ctx.session.token)
              .then(async (t) => {
                setTemas(t);
                const tp = {};
                for (const tema of t) {
                  const props = await apiFetch(
                    `/propostas/tema/${tema.id}/todas`,
                    {},
                    ctx.session.token,
                  ).catch(() => []);
                  tp[tema.id] = props;
                }
                setTemaPropostas(tp);
              })
              .catch(() => {});
          }
        }, [plan?.id]);

        const savePlan = async () => {
          setLoading(true);
          try {
            if (plan) {
              await apiFetch(
                `/planos-de-governo/${plan.id}`,
                { method: "PATCH", body: JSON.stringify(form) },
                ctx.session.token,
              );
              ctx.showToast("Plano atualizado!");
            } else {
              await apiFetch(
                `/planos-de-governo/candidato/${ctx.session.id}`,
                { method: "POST", body: JSON.stringify(form) },
                ctx.session.token,
              );
              ctx.showToast("Plano criado!");
            }
            reload();
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
          setLoading(false);
        };

        const toggleStatus = async () => {
          const newStatus =
            plan.status === "PUBLICADO" ? "RASCUNHO" : "PUBLICADO";
          try {
            await apiFetch(
              `/planos-de-governo/${plan.id}/status?status=${newStatus}`,
              { method: "PATCH" },
              ctx.session.token,
            );
            ctx.showToast(
              `Plano ${newStatus === "PUBLICADO" ? "publicado" : "voltou para rascunho"}!`,
            );
            reload();
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        const createTema = async () => {
          try {
            const t = await apiFetch(
              `/temas/plano/${plan.id}`,
              { method: "POST", body: JSON.stringify(temaForm) },
              ctx.session.token,
            );
            setTemas((prev) => [...prev, t]);
            setTemaPropostas((prev) => ({ ...prev, [t.id]: [] }));
            setTemaForm({ titulo: "", descricao: "" });
            setShowTemaForm(false);
            ctx.showToast("Tema criado!");
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        const createProposta = async (temaId) => {
          try {
            const p = await apiFetch(
              `/propostas/tema/${temaId}`,
              { method: "POST", body: JSON.stringify(propostaForm) },
              ctx.session.token,
            );
            setTemaPropostas((prev) => ({
              ...prev,
              [temaId]: [...(prev[temaId] || []), p],
            }));
            setPropostaForm({ titulo: "", resumo: "", detalhamento: "" });
            setShowPropostaModal(null);
            ctx.showToast("Proposta criada!");
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        const toggleTemaStatus = async (tema) => {
          const newStatus =
            tema.status === "PUBLICADO" ? "RASCUNHO" : "PUBLICADO";
          try {
            await apiFetch(
              `/temas/${tema.id}/status?status=${newStatus}`,
              { method: "PATCH" },
              ctx.session.token,
            );
            setTemas((prev) =>
              prev.map((t) =>
                t.id === tema.id ? { ...t, status: newStatus } : t,
              ),
            );
            ctx.showToast(
              `Tema ${newStatus === "PUBLICADO" ? "publicado" : "voltou para rascunho"}!`,
            );
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        const togglePropostaStatus = async (
          propostaId,
          temaId,
          currentStatus,
        ) => {
          const newStatus =
            currentStatus === "PUBLICADO" ? "RASCUNHO" : "PUBLICADO";
          try {
            await apiFetch(
              `/propostas/${propostaId}/status?status=${newStatus}`,
              { method: "PATCH" },
              ctx.session.token,
            );
            setTemaPropostas((prev) => ({
              ...prev,
              [temaId]: prev[temaId].map((p) =>
                p.id === propostaId ? { ...p, status: newStatus } : p,
              ),
            }));
            ctx.showToast("Status atualizado!");
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        return (
          <div>
            <div
              style={{
                background: "#fff",
                border: "1px solid var(--border)",
                borderRadius: 12,
                padding: "1.5rem",
                marginBottom: "1.5rem",
              }}
            >
              <div
                className="flex justify-between items-center mb-2"
                style={{ marginBottom: "1.25rem" }}
              >
                <div style={{ fontWeight: 700, fontSize: "1.05rem" }}>
                  📄 Plano de Governo
                </div>
                {plan && (
                  <div style={{ display: "flex", gap: "0.5rem" }}>
                    {statusBadge(plan.status)}
                    <button
                      className={`btn btn-sm ${plan.status === "PUBLICADO" ? "btn-outline" : "btn-green"}`}
                      onClick={toggleStatus}
                    >
                      {plan.status === "PUBLICADO"
                        ? "Despublicar"
                        : "🚀 Publicar"}
                    </button>
                  </div>
                )}
              </div>
              <div className="form-group">
                <label className="form-label">Título</label>
                <input
                  className="form-input"
                  value={form.titulo}
                  onChange={set("titulo")}
                  placeholder="Título do seu plano de governo"
                />
              </div>
              <div className="form-group">
                <label className="form-label">Apresentação</label>
                <textarea
                  className="form-textarea"
                  value={form.apresentacao}
                  onChange={set("apresentacao")}
                  rows={4}
                  placeholder="Apresente suas ideias principais..."
                />
              </div>
              <button
                className="btn btn-primary"
                onClick={savePlan}
                disabled={loading}
              >
                {loading
                  ? "Salvando..."
                  : plan
                    ? "💾 Salvar alterações"
                    : "➕ Criar plano"}
              </button>
            </div>

            {plan && (
              <div
                style={{
                  background: "#fff",
                  border: "1px solid var(--border)",
                  borderRadius: 12,
                  padding: "1.5rem",
                }}
              >
                <div
                  className="flex justify-between items-center"
                  style={{ marginBottom: "1.25rem" }}
                >
                  <div style={{ fontWeight: 700, fontSize: "1.05rem" }}>
                    🏷️ Temas e Propostas
                  </div>
                  <button
                    className="btn btn-green btn-sm"
                    onClick={() => setShowTemaForm(true)}
                  >
                    + Adicionar Tema
                  </button>
                </div>

                {showTemaForm && (
                  <div
                    style={{
                      background: "var(--cream)",
                      border: "1px solid var(--border)",
                      borderRadius: 10,
                      padding: "1.25rem",
                      marginBottom: "1rem",
                    }}
                  >
                    <div style={{ fontWeight: 600, marginBottom: "1rem" }}>
                      Novo tema
                    </div>
                    <div className="form-group">
                      <label className="form-label">Título do tema</label>
                      <input
                        className="form-input"
                        value={temaForm.titulo}
                        onChange={(e) =>
                          setTemaForm((f) => ({ ...f, titulo: e.target.value }))
                        }
                        placeholder="Ex: Saúde, Educação, Mobilidade..."
                      />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Descrição</label>
                      <input
                        className="form-input"
                        value={temaForm.descricao}
                        onChange={(e) =>
                          setTemaForm((f) => ({
                            ...f,
                            descricao: e.target.value,
                          }))
                        }
                        placeholder="Breve descrição do tema"
                      />
                    </div>
                    <div style={{ display: "flex", gap: "0.5rem" }}>
                      <button
                        className="btn btn-primary btn-sm"
                        onClick={createTema}
                      >
                        Criar tema
                      </button>
                      <button
                        className="btn btn-outline btn-sm"
                        onClick={() => setShowTemaForm(false)}
                      >
                        Cancelar
                      </button>
                    </div>
                  </div>
                )}

                {temas.length === 0 ? (
                  <div className="empty-state" style={{ padding: "2rem" }}>
                    <div className="empty-icon">🏷️</div>
                    <div className="empty-title">Nenhum tema criado</div>
                    <div className="empty-sub">
                      Adicione temas para organizar suas propostas
                    </div>
                  </div>
                ) : (
                  temas.map((tema) => (
                    <div
                      key={tema.id}
                      style={{
                        border: "1px solid var(--border)",
                        borderRadius: 10,
                        marginBottom: "1rem",
                        overflow: "hidden",
                      }}
                    >
                      <div
                        style={{
                          padding: "1rem 1.25rem",
                          background: "var(--cream)",
                          display: "flex",
                          alignItems: "center",
                          gap: "0.75rem",
                        }}
                      >
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700 }}>{tema.titulo}</div>
                          {tema.descricao && (
                            <div
                              style={{
                                fontSize: "0.8rem",
                                color: "var(--muted)",
                              }}
                            >
                              {tema.descricao}
                            </div>
                          )}
                        </div>
                        <div
                          style={{
                            display: "flex",
                            gap: "0.5rem",
                            alignItems: "center",
                          }}
                        >
                          {statusBadge(tema.status)}
                          <button
                            className={`btn btn-sm ${tema.status === "PUBLICADO" ? "btn-outline" : "btn-green"}`}
                            onClick={() => toggleTemaStatus(tema)}
                          >
                            {tema.status === "PUBLICADO"
                              ? "Despublicar"
                              : "Publicar"}
                          </button>
                          <button
                            className="btn btn-primary btn-sm"
                            onClick={() => {
                              setShowPropostaModal(tema.id);
                              setPropostaForm({
                                titulo: "",
                                resumo: "",
                                detalhamento: "",
                              });
                            }}
                          >
                            + Proposta
                          </button>
                        </div>
                      </div>
                      <div style={{ padding: "0.75rem 1.25rem" }}>
                        {(temaPropostas[tema.id] || []).length === 0 ? (
                          <p
                            style={{
                              fontSize: "0.8rem",
                              color: "var(--muted)",
                              padding: "0.5rem 0",
                            }}
                          >
                            Nenhuma proposta ainda.
                          </p>
                        ) : (
                          (temaPropostas[tema.id] || []).map((p) => (
                            <div
                              key={p.id}
                              style={{
                                display: "flex",
                                alignItems: "center",
                                gap: "0.75rem",
                                padding: "0.6rem 0",
                                borderBottom: "1px solid var(--border)",
                                fontSize: "0.875rem",
                              }}
                            >
                              <div style={{ flex: 1 }}>
                                <span style={{ fontWeight: 600 }}>
                                  {p.titulo}
                                </span>
                                <span
                                  style={{
                                    color: "var(--muted)",
                                    marginLeft: "0.5rem",
                                  }}
                                >
                                  {p.resumo.substring(0, 60)}...
                                </span>
                              </div>
                              <div
                                style={{
                                  display: "flex",
                                  gap: "0.4rem",
                                  flexShrink: 0,
                                }}
                              >
                                {statusBadge(p.status)}
                                <button
                                  className={`btn btn-sm ${p.status === "PUBLICADO" ? "btn-outline" : "btn-green"}`}
                                  onClick={() =>
                                    togglePropostaStatus(
                                      p.id,
                                      tema.id,
                                      p.status,
                                    )
                                  }
                                >
                                  {p.status === "PUBLICADO"
                                    ? "Despublicar"
                                    : "Publicar"}
                                </button>
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}

            {showPropostaModal && (
              <div
                className="modal-overlay"
                onClick={() => setShowPropostaModal(null)}
              >
                <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                  <div className="modal-header">
                    <div className="modal-title">Nova Proposta</div>
                    <button
                      className="modal-close"
                      onClick={() => setShowPropostaModal(null)}
                    >
                      ✕
                    </button>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Título da proposta</label>
                    <input
                      className="form-input"
                      value={propostaForm.titulo}
                      onChange={(e) =>
                        setPropostaForm((f) => ({
                          ...f,
                          titulo: e.target.value,
                        }))
                      }
                      placeholder="Título objetivo e claro"
                      maxLength={150}
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Resumo</label>
                    <textarea
                      className="form-textarea"
                      value={propostaForm.resumo}
                      onChange={(e) =>
                        setPropostaForm((f) => ({
                          ...f,
                          resumo: e.target.value,
                        }))
                      }
                      rows={3}
                      placeholder="Descrição breve da proposta"
                      maxLength={300}
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">
                      Detalhamento{" "}
                      <span
                        style={{ color: "var(--muted)", fontSize: "0.8rem" }}
                      >
                        (opcional)
                      </span>
                    </label>
                    <textarea
                      className="form-textarea"
                      value={propostaForm.detalhamento}
                      onChange={(e) =>
                        setPropostaForm((f) => ({
                          ...f,
                          detalhamento: e.target.value,
                        }))
                      }
                      rows={4}
                      placeholder="Detalhes técnicos, prazos, custos estimados..."
                    />
                  </div>
                  <div style={{ display: "flex", gap: "0.75rem" }}>
                    <button
                      className="btn btn-primary"
                      onClick={() => createProposta(showPropostaModal)}
                      disabled={!propostaForm.titulo || !propostaForm.resumo}
                    >
                      Criar proposta
                    </button>
                    <button
                      className="btn btn-outline"
                      onClick={() => setShowPropostaModal(null)}
                    >
                      Cancelar
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function DashInteractions({ interacoes, ctx, reload }) {
        const [filter, setFilter] = useState("");
        const [respForm, setRespForm] = useState({});
        const [loading, setLoading] = useState({});

        const filtered = filter
          ? interacoes.filter((i) => i.status === filter || i.tipo === filter)
          : interacoes;

        const respond = async (id) => {
          if (!respForm[id]?.trim()) return;
          setLoading((l) => ({ ...l, [id]: true }));
          try {
            await apiFetch(
              `/interacoes/${id}/responder`,
              {
                method: "PATCH",
                body: JSON.stringify({ resposta: respForm[id] }),
              },
              ctx.session.token,
            );
            ctx.showToast("Resposta enviada!");
            reload();
            setRespForm((f) => ({ ...f, [id]: "" }));
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
          setLoading((l) => ({ ...l, [id]: false }));
        };

        const updateStatus = async (id, status) => {
          try {
            await apiFetch(
              `/interacoes/${id}/status?status=${status}`,
              { method: "PATCH" },
              ctx.session.token,
            );
            ctx.showToast("Status atualizado!");
            reload();
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
        };

        return (
          <div>
            <div
              style={{
                display: "flex",
                gap: "0.5rem",
                marginBottom: "1.5rem",
                flexWrap: "wrap",
              }}
            >
              {[
                "",
                "RECEBIDA",
                "EM_ANALISE",
                "RESPONDIDA",
                "FINALIZADA",
                "DUVIDA",
                "DEMANDA",
              ].map((f) => (
                <button
                  key={f}
                  className={`btn btn-sm ${filter === f ? "btn-primary" : "btn-outline"}`}
                  onClick={() => setFilter(f)}
                >
                  {f || "Todas"}
                </button>
              ))}
            </div>

            {filtered.length === 0 ? (
              <div className="empty-state">
                <div className="empty-icon">💬</div>
                <div className="empty-title">Nenhuma interação</div>
              </div>
            ) : (
              filtered.map((i) => (
                <div key={i.id} className="interacao-card">
                  <div className="interacao-header">
                    <div className="interacao-title">
                      {i.titulo || "(sem título)"}
                    </div>
                    <div style={{ display: "flex", gap: "0.4rem" }}>
                      {statusBadge(i.tipo)}
                      {statusBadge(i.status)}
                    </div>
                  </div>
                  <div className="interacao-meta">
                    <span>Eleitor #{i.eleitorId}</span>
                    <span>{fmtDate(i.dataInicio)}</span>
                  </div>
                  <div className="interacao-conteudo">{i.conteudo}</div>

                  {i.urlComprovacao && (
                    <div
                      style={{ fontSize: "0.8rem", marginBottom: "0.75rem" }}
                    >
                      🔗{" "}
                      <a
                        href={i.urlComprovacao}
                        target="_blank"
                        rel="noopener noreferrer"
                        style={{ color: "var(--gold)" }}
                      >
                        {i.urlComprovacao}
                      </a>
                    </div>
                  )}

                  {i.resposta && (
                    <div className="interacao-resposta">
                      <div className="interacao-resposta-label">
                        ✓ Sua resposta
                      </div>
                      {i.resposta}
                    </div>
                  )}

                  {(i.status === "RECEBIDA" || i.status === "EM_ANALISE") && (
                    <div className="responder-form">
                      <textarea
                        className="form-textarea"
                        value={respForm[i.id] || ""}
                        onChange={(e) =>
                          setRespForm((f) => ({ ...f, [i.id]: e.target.value }))
                        }
                        placeholder="Digite sua resposta..."
                        rows={3}
                      />
                      <div
                        style={{
                          display: "flex",
                          gap: "0.5rem",
                          marginTop: "0.75rem",
                          flexWrap: "wrap",
                        }}
                      >
                        <button
                          className="btn btn-green btn-sm"
                          onClick={() => respond(i.id)}
                          disabled={loading[i.id] || !respForm[i.id]?.trim()}
                        >
                          {loading[i.id] ? "Enviando..." : "✓ Responder"}
                        </button>
                        <button
                          className="btn btn-outline btn-sm"
                          onClick={() => updateStatus(i.id, "EM_ANALISE")}
                        >
                          Em análise
                        </button>
                        <button
                          className="btn btn-outline btn-sm"
                          onClick={() => updateStatus(i.id, "FINALIZADA")}
                        >
                          Finalizar
                        </button>
                      </div>
                    </div>
                  )}

                  {i.status === "RESPONDIDA" && (
                    <button
                      className="btn btn-outline btn-sm"
                      style={{ marginTop: "0.75rem" }}
                      onClick={() => updateStatus(i.id, "FINALIZADA")}
                    >
                      Finalizar interação
                    </button>
                  )}
                </div>
              ))
            )}
          </div>
        );
      }

      function DashProfile({ ctx }) {
        const [form, setForm] = useState({
          nome: "",
          email: "",
          partido: "",
          cargo: "",
          biografia: "",
          senha: "",
        });
        const [loading, setLoading] = useState(false);

        useEffect(() => {
          apiFetch(`/candidatos/${ctx.session.id}`, {}, ctx.session.token)
            .then((d) =>
              setForm({
                nome: d.nome,
                email: d.email,
                partido: d.partido || "",
                cargo: d.cargo || "",
                biografia: d.biografia || "",
                senha: "",
              }),
            )
            .catch(() => {});
        }, []);

        const set = (k) => (e) =>
          setForm((f) => ({ ...f, [k]: e.target.value }));

        const save = async () => {
          setLoading(true);
          try {
            const body = { ...form };
            if (!body.senha) delete body.senha;
            await apiFetch(
              `/candidatos/${ctx.session.id}`,
              { method: "PUT", body: JSON.stringify(body) },
              ctx.session.token,
            );
            ctx.showToast("Perfil atualizado!");
          } catch (e) {
            ctx.showToast(e.message, "error");
          }
          setLoading(false);
        };

        return (
          <div
            style={{
              background: "#fff",
              border: "1px solid var(--border)",
              borderRadius: 12,
              padding: "1.5rem",
              maxWidth: 580,
            }}
          >
            <div
              style={{
                fontWeight: 700,
                fontSize: "1.05rem",
                marginBottom: "1.25rem",
              }}
            >
              👤 Meu Perfil
            </div>
            <div className="form-group">
              <label className="form-label">Nome</label>
              <input
                className="form-input"
                value={form.nome}
                onChange={set("nome")}
              />
            </div>
            <div className="form-group">
              <label className="form-label">E-mail</label>
              <input
                className="form-input"
                type="email"
                value={form.email}
                onChange={set("email")}
              />
            </div>
            <div className="form-group">
              <label className="form-label">Partido</label>
              <input
                className="form-input"
                value={form.partido}
                onChange={set("partido")}
              />
            </div>
            <div className="form-group">
              <label className="form-label">Cargo</label>
              <input
                className="form-input"
                value={form.cargo}
                onChange={set("cargo")}
              />
            </div>
            <div className="form-group">
              <label className="form-label">Biografia</label>
              <textarea
                className="form-textarea"
                value={form.biografia}
                onChange={set("biografia")}
                rows={4}
              />
            </div>
            <div className="form-group">
              <label className="form-label">
                Nova senha{" "}
                <span style={{ color: "var(--muted)", fontSize: "0.8rem" }}>
                  (deixe em branco para não alterar)
                </span>
              </label>
              <input
                className="form-input"
                type="password"
                value={form.senha}
                onChange={set("senha")}
                placeholder="••••••••"
              />
            </div>
            <button
              className="btn btn-primary"
              onClick={save}
              disabled={loading}
            >
              {loading ? "Salvando..." : "💾 Salvar perfil"}
            </button>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById("root"));
    </script>
  </body>
</html>
