<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com a Equipe do Candidato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        
        <div class="card shadow-lg">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Fale com o Deputado</h5>
            </div>
            
            <div class="card-body chat-box" id="area-mensagens">
                <div class="mensagem ia">
                    Olá! Sou o assistente digital do Deputado. Como podemos te ajudar?
                </div>
            </div>

            <div class="card-footer d-flex align-items-center">
                
                <input type="file" id="campo-arquivo" accept="image/*" style="display: none;">
                
                <label for="campo-arquivo" class="btn btn-secondary me-2 mb-0" style="cursor: pointer;" title="Anexar Foto">
                    📎
                </label>

                <input type="text" id="campo-texto" class="form-control me-2" placeholder="Digite sua demanda...">
                <button class="btn btn-primary" id="btn-enviar">Enviar</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
